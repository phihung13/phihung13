<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Terminal deploying an AI agent">
  <title>phihung@ai — deploying agent</title>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#36BCF7"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One mask per line. The rect's width grows = characters appearing.
         width="740" is the static fallback: if animation is blocked, all text still shows. -->
    <mask id="m1">
      <rect x="40" y="0" width="740" height="270" fill="#fff">
        <animate attributeName="width" values="0;0;740;740;0" keyTimes="0;0.036;0.143;0.893;1"
                 dur="14s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m2">
      <rect x="40" y="0" width="740" height="270" fill="#fff">
        <animate attributeName="width" values="0;0;740;740;0" keyTimes="0;0.157;0.264;0.893;1"
                 dur="14s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m3">
      <rect x="40" y="0" width="740" height="270" fill="#fff">
        <animate attributeName="width" values="0;0;740;740;0" keyTimes="0;0.279;0.386;0.893;1"
                 dur="14s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m4">
      <rect x="40" y="0" width="740" height="270" fill="#fff">
        <animate attributeName="width" values="0;0;740;740;0" keyTimes="0;0.4;0.614;0.893;1"
                 dur="14s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m5">
      <rect x="40" y="0" width="740" height="270" fill="#fff">
        <animate attributeName="width" values="0;0;740;740;0" keyTimes="0;0.629;0.736;0.893;1"
                 dur="14s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- animated gradient frame -->
  <rect x="2" y="2" width="816" height="266" rx="14" fill="url(#glow)" opacity="0.9"/>
  <rect x="4" y="4" width="812" height="262" rx="12" fill="url(#screen)"/>

  <!-- title bar -->
  <rect x="4" y="4" width="812" height="34" rx="12" fill="#161B22"/>
  <rect x="4" y="30" width="812" height="8" fill="#161B22"/>
  <circle cx="26" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="21" r="6" fill="#27C93F"/>
  <text x="92" y="26" font-family="Consolas, 'SF Mono', monospace" font-size="13" fill="#6E7681">phihung@ai — ~/agents</text>

  <!-- typed lines -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="16">
    <text x="40" y="76" fill="#C9D1D9" mask="url(#m1)">
      <tspan fill="#3FB950">$</tspan> ./deploy_agent.sh --model opus
    </text>
    <text x="40" y="108" fill="#8B949E" mask="url(#m2)">
      <tspan fill="#36BCF7">[✓]</tspan> vision pipeline loaded
    </text>
    <text x="40" y="140" fill="#8B949E" mask="url(#m3)">
      <tspan fill="#36BCF7">[✓]</tspan> Zalo + n8n connected
    </text>
    <text x="40" y="172" fill="#8B949E" mask="url(#m4)">
      <tspan fill="#7C3AED">▓▓▓▓▓▓▓▓▓▓▓▓</tspan> 100%
    </text>
    <text x="40" y="204" fill="#C9D1D9" mask="url(#m5)" filter="url(#softglow)">
      <tspan fill="#3FB950">✔</tspan> agent online — automating the boring.
    </text>

    <!-- prompt + blinking caret -->
    <text x="40" y="238" font-size="16" fill="#3FB950">$</text>
    <rect x="56" y="226" width="9" height="16" fill="#36BCF7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1"
               dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanline sweep -->
  <rect x="4" y="0" width="812" height="2" fill="#36BCF7" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 270"
                      dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
